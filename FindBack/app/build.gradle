// FindBack: smartphone object memory with evidence-guided verification.
// Based on the ARCore ml_kotlin sample (Apache 2.0, Google LLC).
apply plugin: 'com.android.application'

// v0.7: the git commit the app is built from, logged as `session_start.appCommit`.
// "-dirty" when tracked files differ from it; "unknown" without git.
def gitCommit = { ->
    try {
        def hash = providers.exec {
            commandLine 'git', 'rev-parse', '--short', 'HEAD'
            ignoreExitValue = true
        }.standardOutput.asText.get().trim()
        if (!hash) return 'unknown'
        def changes = providers.exec {
            // --no-optional-locks: read only, never refreshes the index
            commandLine 'git', '--no-optional-locks', 'status', '--porcelain', '--untracked-files=no'
            ignoreExitValue = true
        }.standardOutput.asText.get().trim()
        return changes ? hash + '-dirty' : hash
    } catch (Exception ignored) {
        return 'unknown'
    }
}()

android {
    namespace "edu.cs6301.findback"
    compileSdkVersion 37

    defaultConfig {
        applicationId "edu.cs6301.findback"
        minSdkVersion 24
        targetSdkVersion 37
        versionCode 1
        versionName '0.8'
        ndk { abiFilters 'arm64-v8a' }
        buildConfigField 'String', 'GIT_COMMIT', "\"${gitCommit}\""
    }
    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    androidResources {
        // Keep the TFLite model uncompressed so MediaPipe can memory-map it.
        noCompress 'tflite'
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.7.3'

    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.coordinatorlayout:coordinatorlayout:1.2.0'
    implementation 'androidx.lifecycle:lifecycle-common-java8:2.6.2'
    implementation 'com.google.android.material:material:1.9.0'

    // ARCore (Google Play Services for AR).
    // Pinned to 1.48.0 to match the ARCore APK on the Pixel 8 (1.48.x). An app built with SDK X requires ARCore >= X.
    implementation 'com.google.ar:core:1.48.0'

    // ML Kit object detector: class-agnostic boxes + coarse categories.
    implementation 'com.google.mlkit:object-detection:16.2.3'

    // MediaPipe image embedder: appearance embeddings for record matching and verification.
    implementation 'com.google.mediapipe:tasks-vision:0.10.26'

    // OBJ loader required by the sample render framework.
    implementation 'de.javagl:obj:0.2.1'

    // JVM unit tests (./gradlew testDebugUnitTest). Android's org.json is stubbed in unit tests,
    // so the real one is added for the JSON round-trip tests. Test-only, not shipped.
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20231013'
}
